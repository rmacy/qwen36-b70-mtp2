name: Validate GHCR release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select version
        id: version
        shell: bash
        run: |
          value="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            value="manual-${GITHUB_RUN_NUMBER}"
          fi
          printf 'value=%s\n' "${value}" >> "${GITHUB_OUTPUT}"

      - name: Verify source package
        shell: bash
        run: |
          sha256sum -c SHA256SUMS
          python3 tests/test_benchmark.py

      - name: Build clean release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: qwen36-b70-mtp2:${{ steps.version.outputs.value }}
          provenance: false
          sbom: false

      - name: Verify image metadata
        shell: bash
        run: |
          image="qwen36-b70-mtp2:${{ steps.version.outputs.value }}"
          source=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            "${image}")
          test "${source}" = "https://github.com/${GITHUB_REPOSITORY}"

      - name: Verify published tag is anonymously readable
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          scope="repository:${GITHUB_REPOSITORY_OWNER}/qwen36-b70-mtp2:pull"
          token=$(curl -fsS "https://ghcr.io/token?scope=${scope}" | jq -r .token)
          test -n "${token}"
          curl -fsS \
            -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/qwen36-b70-mtp2/manifests/${{ steps.version.outputs.value }}"
